# Invyte — Coolify Deploy
# Same as docker/docker-compose.yml but without Caddy (Coolify provides its
# own reverse proxy + TLS) and with a one-shot `migrate` service instead of
# running migrations manually.
#
# Lives at repo root (not docker/) on purpose: Coolify's build-context
# resolver mishandles `context: ..` when the compose file sits in a
# subdirectory (context path gets computed without the checkout's UUID
# segment and 404s). Keeping this file at root with `context: .` sidesteps
# that entirely — see MIGRATION_NOTES.md / DEPLOYMENT.md for the story.
#
# Usage: docker compose --env-file .env -f docker-compose.coolify.yml up -d --build

services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: invyte_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - invyte
    entrypoint: ["pnpm", "--filter", "@invyte/db", "db:migrate"]

  createbucket:
    image: minio/mc:latest
    container_name: invyte_createbucket
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-invyte}
    networks:
      - invyte
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      (mc ls local/$$STORAGE_BUCKET > /dev/null 2>&1 || mc mb local/$$STORAGE_BUCKET) &&
      mc anonymous set download local/$$STORAGE_BUCKET
      "

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: invyte_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GUEST_PHONE_HASH_SALT: ${GUEST_PHONE_HASH_SALT}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-invyte}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WA_CLOUD_API_TOKEN: ${WA_CLOUD_API_TOKEN:-}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
      WA_BUSINESS_ACCOUNT_ID: ${WA_BUSINESS_ACCOUNT_ID:-}
      APP_URL: ${APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
    expose:
      - "3000"
    networks:
      - invyte
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: invyte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-invyte}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    networks:
      - invyte
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invyte} -d ${POSTGRES_DB:-invyte}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: invyte_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - invyte
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: invyte_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    networks:
      - invyte
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  invyte:
    driver: bridge
